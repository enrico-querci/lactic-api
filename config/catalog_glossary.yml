# Fitness glossary for Italian catalog content.
#
# Two jobs:
#
#   1. It supplies the canonical Italian term for every taxonomy value, which
#      is what `Catalog::Translation::DescriptionBuilder` composes generated
#      descriptions from.
#   2. It keeps terminology consistent. A general-purpose translator renders
#      "Lats" as "Latissimi", "Gran dorsale" or "Dorsali" depending on the
#      surrounding sentence; a coach reading a catalog wants one word.
#
# Anything missing here falls back to the English term rather than guessing,
# which is visible and fixable. Add entries as the provider's vocabulary grows.
muscles:
  Abductors: Abduttori
  Abs: Addominali
  Adductors: Adduttori
  Ankles: Caviglie
  Biceps: Bicipiti
  Calves: Polpacci
  Cardiovascular System: Sistema cardiovascolare
  Core: Core
  Delts: Deltoidi
  Feet: Piedi
  Forearms: Avambracci
  Glutes: Glutei
  Hamstrings: Ischiocrurali
  Hip Flexors: Flessori dell'anca
  Lats: Dorsali
  Levator Scapulae: Elevatore della scapola
  Lower Back: Zona lombare
  Obliques: Obliqui
  Pectorals: Pettorali
  Quads: Quadricipiti
  Rhomboids: Romboidi
  Serratus Anterior: Dentato anteriore
  Spine: Colonna vertebrale
  Traps: Trapezi
  Triceps: Tricipiti
  Upper Back: Parte alta della schiena
  # Not provider vocabulary — these are the legacy exercises.muscle_group
  # values from the hand-written seeds (db/seeds.rb), predating the
  # provider import. Two intentionally alias an existing provider term
  # above: Chest -> Pettorali (same as Pectorals), Quadriceps ->
  # Quadricipiti (same as Quads). Catalog::Translation::TaxonomyLabels sums
  # rather than assigns when localizing volume_sets specifically so this
  # collision merges sets under one badge instead of dropping one side's.
  Back: Schiena
  Chest: Pettorali
  Full Body: Total body
  Quadriceps: Quadricipiti
  Shoulders: Spalle

