# `region` is the coarse grouping the provider calls bodyPart. Verified
# functionally determined by the muscle across a 140-record provider sample.
abs:
  key: abs
  name: Abs
  region: Waist

pectorals:
  key: pectorals
  name: Pectorals
  region: Chest

triceps:
  key: triceps
  name: Triceps
  region: Upper Arms

# Secondary-only muscles: they appear in the provider's open `secondaryMuscles`
# vocabulary but never as a `target`, so they carry no region.
hip_flexors:
  key: hip_flexors
  name: Hip Flexors
  region:

lower_back:
  key: lower_back
  name: Lower Back
  region:

cardiovascular_system:
  key: cardiovascular_system
  name: Cardiovascular System
  region: Cardio
